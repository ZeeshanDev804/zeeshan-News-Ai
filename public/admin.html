<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    ZEESHAN NEWS AI — CEO Command Center
  </title>

  <meta
    name="description"
    content="ZEESHAN NEWS AI Founder and CEO Command Center"
  >

  <style>
    :root {
      --bg: #060b11;
      --panel: #0c141d;
      --panel2: #101b26;
      --border: rgba(255,255,255,0.08);
      --text: #edf5f8;
      --muted: #899ba8;
      --green: #39e6a5;
      --blue: #55baff;
      --orange: #ffb45b;
      --red: #ff6578;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      min-height: 100vh;

      background:
        linear-gradient(
          rgba(255,255,255,0.025) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,0.025) 1px,
          transparent 1px
        ),
        var(--bg);

      background-size: 32px 32px;

      color: var(--text);

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .container {
      width: min(1250px, 94%);
      margin: auto;
      padding: 18px 0 50px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;

      padding: 18px;

      background:
        rgba(12,20,29,0.92);

      border:
        1px solid var(--border);

      border-radius: 18px;

      backdrop-filter:
        blur(14px);

      position: sticky;
      top: 10px;
      z-index: 20;
    }

    .brand {
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 0.08em;
    }

    .brand span {
      color: var(--green);
    }

    .role {
      color: var(--muted);
      font-size: 11px;
      margin-top: 5px;
    }

    .system-status {
      display: flex;
      align-items: center;
      gap: 8px;

      color: var(--green);

      font-size: 12px;
      font-weight: 800;
    }

    .dot {
      width: 9px;
      height: 9px;

      border-radius: 50%;

      background:
        var(--green);

      box-shadow:
        0 0 13px var(--green);
    }

    .hero {
      margin: 28px 0 20px;
    }

    .hero h1 {
      margin: 0;

      font-size:
        clamp(28px, 6vw, 52px);

      line-height: 1.05;
    }

    .hero p {
      margin: 10px 0 0;

      color: var(--muted);

      font-size: 14px;
    }

    .stats {
      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 12px;
    }

    .stat {
      background:
        rgba(12,20,29,0.92);

      border:
        1px solid var(--border);

      border-radius: 15px;

      padding: 17px;

      min-height: 120px;
    }

    .label {
      color: var(--muted);

      font-size: 11px;

      text-transform:
        uppercase;

      letter-spacing:
        0.08em;
    }

    .value {
      margin-top: 12px;

      font-size: 30px;

      font-weight: 900;
    }

    .section {
      margin-top: 18px;

      background:
        rgba(12,20,29,0.92);

      border:
        1px solid var(--border);

      border-radius: 17px;

      padding: 17px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;

      margin-bottom: 14px;
    }

    .section h2 {
      margin: 0;

      font-size: 16px;
    }

    .section-code {
      color: var(--muted);

      font-size: 10px;

      letter-spacing:
        0.12em;
    }

    .rows {
      display: grid;
      gap: 8px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;

      padding: 11px 13px;

      background:
        var(--panel2);

      border:
        1px solid var(--border);

      border-radius: 10px;

      font-size: 13px;
    }

    .row-name {
      color: var(--muted);
    }

    .badge {
      display: inline-flex;

      padding:
        5px 9px;

      border-radius:
        999px;

      font-size: 10px;

      font-weight: 800;

      background:
        rgba(57,230,165,0.1);

      color:
        var(--green);
    }

    .warning {
      color:
        var(--orange);

      background:
        rgba(255,180,91,0.1);
    }

    .danger {
      color:
        var(--red);

      background:
        rgba(255,101,120,0.1);
    }

    .info {
      color:
        var(--blue);

      background:
        rgba(85,186,255,0.1);
    }

    .controls {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 10px;
    }

    .control {
      padding: 14px;

      background:
        var(--panel2);

      border:
        1px solid var(--border);

      border-radius: 12px;
    }

    .control strong {
      display: block;

      margin-bottom: 5px;

      font-size: 13px;
    }

    .control span {
      color: var(--muted);

      font-size: 11px;
    }

    .refresh {
      width: 100%;

      margin-top: 18px;

      padding: 14px;

      border:
        1px solid var(--border);

      border-radius: 12px;

      background:
        var(--panel2
