<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <!-- =========================
       BASIC SEO
  ========================== -->

  <meta

    content="ZEESHAN NEWS AI — AI-powered global news covering technology, business, sports, entertainment, trends and major developments from trusted sources."

  />

  />

    content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
  />

  <meta

    content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
  />

  <meta
    name="theme-color"
    content="#05070d"
  />

  <!-- Canonical -->
  <link
    rel="canonical"
    href="/"
  />

  <!-- =========================
       OPEN GRAPH
  ========================== -->

  <meta
    property="og:type"
    content="website"
  />

  <meta
    property="og:title"
    content="ZEESHAN NEWS AI — Global News & AI Intelligence"
  />

  <meta
    property="og:description"
    content="AI-powered global news covering technology, business, sports, entertainment, trends and major developments."
  />

  <meta
    property="og:site_name"
    content="ZEESHAN NEWS AI"
  />

  <meta
    property="og:url"
    content="/"
  />

  <!-- =========================
       TWITTER / X CARD
  ========================== -->

  <meta
    name="twitter:card"
    content="summary_large_image"
  />

  <meta
    name="twitter:title"
    content="ZEESHAN NEWS AI — Global News & AI Intelligence"
  />

  <meta
    name="twitter:description"
    content="AI-powered global news, technology, business, sports, entertainment and trending stories."
  />

  <!-- =========================
       TITLE
  ========================== -->

  <title>
    ZEESHAN NEWS AI — Global News & AI Intelligence
  </title>

  <!-- Engagement / Polls / Quizzes -->
  <link
    rel="stylesheet"
    href="/engagement.css"
  />

  <!-- =========================
       WEBSITE STRUCTURED DATA
  ========================== -->

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "NewsMediaOrganization",
    "name": "ZEESHAN NEWS AI",
    "description": "AI-powered global news platform covering technology, business, sports, entertainment, trends and major developments.",
    "url": "/",
    "publishingPrinciples": "/editorial-policy.html"
  }
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      background:
        radial-gradient(
          circle at top,
          rgba(40, 70, 120, 0.18),
          transparent 40%
        ),
        #05070d;
      color: #f5f7fb;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      width: 100%;
      border-bottom: 1px solid
        rgba(255, 255, 255, 0.08);
      background:
        rgba(5, 7, 13, 0.9);
      backdrop-filter: blur(16px);
    }

    .header-inner {
      width: 100%;
      max-width: 1200px;
      min-height: 70px;
      margin: 0 auto;
      padding: 0 18px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;

      display: grid;
      place-items: center;

      background:
        linear-gradient(
          135deg,
          #1b273f,
          #0b101d
        );

      border: 1px solid
        rgba(255, 255, 255, 0.12);

      font-size: 15px;
      font-weight: 900;
    }

    .brand-text {
      min-width: 0;
    }

    .brand-title {
      margin: 0;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.8px;
    }

    .brand-subtitle {
      margin: 3px 0 0;
      font-size: 10px;
      opacity: 0.58;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .header-nav {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-nav a {
      padding: 9px 11px;
      border-radius: 9px;
      font-size: 13px;
      opacity: 0.75;
      transition:
        background 0.18s ease,
        opacity 0.18s ease;
    }

    .header-nav a:hover {
      background:
        rgba(255, 255, 255, 0.07);
      opacity: 1;
    }

    .hero {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 70px 18px 45px;
    }

    .hero-card {
      position: relative;
      overflow: hidden;

      padding: 42px 30px;
      border-radius: 24px;

      border: 1px solid
        rgba(255, 255, 255, 0.1);

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.075),
          rgba(255, 255, 255, 0.025)
        );

      box-shadow:
        0 25px 80px
        rgba(0, 0, 0, 0.3);
    }

    .hero-card::before {
      content: "";
      position: absolute;
      inset: 0;

      background-image:
        linear-gradient(
          rgba(255, 255, 255, 0.025) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.025) 1px,
          transparent 1px
        );

      background-size:
        32px 32px;

      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 1;
      max-width: 800px;
    }

    .hero-label {
      display: inline-block;
      margin-bottom: 14px;

      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      opacity: 0.65;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(
        34px,
        7vw,
        64px
      );
      line-height: 1.02;
      letter-spacing: -1.8px;
    }

    .hero h1 span {
      opacity: 0.55;
    }

    .hero-description {
      max-width: 650px;
      margin: 20px 0 0;

      font-size: 16px;
      line-height: 1.7;
      opacity: 0.72;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 26px;
    }

    .hero-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 44px;
      padding: 0 17px;

      border-radius: 11px;

      border: 1px solid
        rgba(255, 255, 255, 0.12);

      background:
        rgba(255, 255, 255, 0.06);

      color: inherit;

      font-size: 13px;
      font-weight: 700;

      cursor: pointer;
    }

    .hero-button:hover {
      background:
        rgba(255, 255, 255, 0.11);
    }

    .section {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 35px 18px;
    }

    .section-heading {
      margin-bottom: 20px;
    }

    .section-heading span {
      display: block;

      margin-bottom: 7px;

      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;

      opacity: 0.55;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 28px;
    }

    .section-heading p {
      max-width: 650px;
      margin: 8px 0 0;

      font-size: 14px;
      line-height: 1.6;
      opacity: 0.65;
    }

    .news-grid {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(280px, 1fr)
        );

      gap: 18px;
    }

    .news-card {
      padding: 20px;

      border-radius: 18px;

      border: 1px solid
        rgba(255, 255, 255, 0.09);

      background:
        rgba(255, 255, 255, 0.035);

      min-height: 180px;
    }

    .news-card-label {
      display: inline-block;

      margin-bottom: 12px;

      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;

      opacity: 0.5;
    }

    .news-card h3 {
      margin: 0 0 10px;

      font-size: 19px;
      line-height: 1.4;
    }

    .news-card p {
      margin: 0;

      font-size: 13px;
      line-height: 1.65;

      opacity: 0.65;
    }

    .status-section {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 18px 45px;
    }

    .status-card {
      padding: 20px;

      border-radius: 18px;

      border: 1px solid
        rgba(255, 255, 255, 0.09);

      background:
        rgba(255, 255, 255, 0.035);
    }

    .status-title {
      margin: 0 0 14px;

      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    #system-status {
      font-size: 13px;
      line-height: 1.7;
      opacity: 0.7;
    }

    .site-footer {
      margin-top: 40px;

      border-top: 1px solid
        rgba(255, 255, 255, 0.08);
    }

    .footer-inner {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;

      padding: 28px 18px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .footer-brand {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.8px;
    }

    .footer-copy {
      margin: 5px 0 0;

      font-size: 11px;
      opacity: 0.5;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .footer-links a {
      font-size: 11px;
      opacity: 0.6;
    }

    .footer-links a:hover {
      opacity: 1;
    }

    @media (max-width: 760px) {
      .header-inner {
        min-height: 62px;
      }

      .header-nav {
        display: none;
      }

      .hero {
        padding-top: 35px;
      }

      .hero-card {
        padding: 30px 20px;
        border-radius: 20px;
      }

      .hero-description {
        font-size: 14px;
      }

      .section {
        padding-left: 12px;
        padding-right: 12px;
      }

      .status-section {
        padding-left: 12px;
        padding-right: 12px;
      }

      .footer-inner {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header class="site-header">
    <div class="header-inner">

      <a
        href="/"
        class="brand"
        aria-label="ZEESHAN NEWS AI Home"
      >
        <div class="brand-logo">
          ZN
        </div>

        <div class="brand-text">
          <p class="brand-title">
            ZEESHAN NEWS AI
          </p>

          <p class="brand-subtitle">
            Global AI News Platform
          </p>
        </div>
      </a>

      <nav
        class="header-nav"
        aria-label="Main navigation"
      >
        <a href="/">Home</a>
        <a href="#latest">Latest</a>
        <a href="#community
