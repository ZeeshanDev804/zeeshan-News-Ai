name: RSS News Test
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  rss-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node rssFetcher.test.js